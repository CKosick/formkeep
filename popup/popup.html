<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FormKeep</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <img src="../icons/icon-32.png" alt="FormKeep" class="logo-icon">
        <div class="brand-text">
          <h1 class="brand-name">FormKeep</h1>
          <span class="brand-badge">Local &amp; Private</span>
        </div>
      </div>
      <div class="header-actions">
        <button id="btnOptions" class="icon-btn" title="Settings &amp; Retention" aria-label="Settings">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Site Status & Toggle Bar -->
    <div id="siteControlCard" class="site-card">
      <div class="site-info">
        <span class="site-label">Current Site</span>
        <span id="currentDomain" class="site-domain">loading...</span>
      </div>
      <div class="site-toggle-wrap">
        <label class="switch">
          <input type="checkbox" id="siteToggle" checked>
          <span class="slider round"></span>
        </label>
      </div>
    </div>

    <!-- Disabled Warning Banner -->
    <div id="siteDisabledBanner" class="disabled-banner hidden">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line>
      </svg>
      <span>FormKeep is paused on this site. No text is saved.</span>
    </div>

    <!-- Search Box -->
    <div class="search-bar">
      <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" id="searchInput" placeholder="Search saved text or fields...">
      <button id="clearSearchBtn" class="clear-btn hidden" aria-label="Clear search">&times;</button>
    </div>

    <!-- Navigation Tabs -->
    <nav class="nav-tabs">
      <button id="tabCurrentSite" class="tab-btn active">
        <span>This Site</span>
        <span id="badgeCurrentSite" class="tab-badge">0</span>
      </button>
      <button id="tabAllSites" class="tab-btn">
        <span>All Recent</span>
        <span id="badgeAllSites" class="tab-badge">0</span>
      </button>
    </nav>

    <!-- Main Content Area -->
    <main class="content-scroll">
      <!-- Loading indicator -->
      <div id="loadingState" class="state-view">
        <div class="spinner"></div>
        <p>Loading saved snapshots...</p>
      </div>

      <!-- Empty state -->
      <div id="emptyState" class="state-view hidden">
        <div class="empty-icon">📝</div>
        <h3>No snapshots found</h3>
        <p id="emptyStateMessage">FormKeep silently saves what you type. Type into any text box or form to test it!</p>
      </div>

      <!-- Entries list container -->
      <div id="entriesList" class="entries-list"></div>
    </main>

    <!-- Footer -->
    <footer class="app-footer">
      <div class="footer-stats">
        <span id="retentionNote">Auto-cleans older than 7 days</span>
      </div>
      <div class="footer-links">
        <a href="../docs/privacy.html" target="_blank" class="footer-link">Privacy Policy</a>
      </div>
    </footer>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
